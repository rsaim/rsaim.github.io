<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
    //
    // GitHub Pages has no server-side router, so a direct hit to a React
    // Router route (e.g. /project) 404s here instead of reaching index.html.
    // This encodes the path into a query string and redirects to the site
    // root; a matching snippet in index.html decodes it and restores the
    // real path via history.replaceState before React Router reads it.
    var pathSegmentsToKeep = 0;

    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
